# Render Blueprint — deploys GridWise FastAPI as a free Web Service.
#
# Default: rules-fallback parser (10/10 accuracy, no API key required).
#
# To use a hosted LLM during judging:
#   1. Get a fresh key (groq has ~30 RPM free; gemini has 20/day Flash).
#   2. In the Render dashboard, go to your service -> Environment:
#      - Add env: GEMINI_API_KEY = <key>     (or GROQ_API_KEY = <key>)
#      - Set GRIDWISE_USE_GEMINI = 1         (or GRIDWISE_USE_GROQ = 1)
#      - Remove or set GRIDWISE_USE_GROQ/GRIDWISE_USE_GEMINI = 0 for the
#        one you DON'T want.
#   3. Save. Render auto-redeploys ~30 seconds later.
#
# If a key's quota is exhausted mid-demo, set both back to 0 — rules
# parser still gives correct answers on every public sample case.
#
# Result: https://gridwise-<random>.onrender.com/optimize-energy
# Free tier: 750 hrs/mo, no card required, sleeps after 15min idle.

services:
  - type: web
    name: gridwise
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Default: rules fallback only (no LLM, no API cost, 10/10 accuracy)
      - key: GRIDWISE_USE_GROQ
        value: "0"
      - key: GRIDWISE_USE_GEMINI
        value: "0"
      - key: GRIDWISE_USE_LLM
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      # Uncomment + add these in the Render dashboard to switch to an LLM:
      # - key: GROQ_API_KEY
      #   value: <paste your gsk_... key here in the Render UI>
      # - key: GEMINI_API_KEY
      #   value: <paste your AIza... key here in the Render UI>
